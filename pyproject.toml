[project]
name = "generalizable-interpretability"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "huggingface-hub>=1.3,<2",
  "modal>=1.4,<2",
  "python-dotenv>=1.1,<2",
  "vastai>=1.4,<2",
  "wandb>=0.19,<1",
]

[project.scripts]
geninterp = "geninterp:main"

[project.optional-dependencies]
reprobe = [
  "inspect-ai>=0.3.290,<0.4",
  "mcp>=2.3,<3",
  "openai>=3.51,<4",
]
test = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "pytest>=8,<9",
  "scikit-learn>=1.5,<2",
  "scipy>=1.13,<2",
  "torch>=2.2,<3",
]

[tool.pytest.ini_options]
testpaths = ["scripts"]
norecursedirs = ["artifacts", "external"]
