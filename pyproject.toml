[project]
name = "generalizable-interpretability"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "huggingface-hub>=1.3,<2",
  "modal>=1.4,<2",
  "python-dotenv>=1.1,<2",
  "vastai>=1.4,<2",
  "wandb>=0.19,<1",
]

[tool.pytest.ini_options]
testpaths = ["infra", "replications"]
norecursedirs = ["artifacts", "external"]
